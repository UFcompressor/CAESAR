name: Model registration

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to retry (ownership still comes from the issue author)
        required: true

permissions:
  contents: write
  issues: write

jobs:
  register:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[model-registry] ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: database
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Require a pinned, administrator-selected CAESAR revision
        env:
          REGISTRY_REF: ${{ vars.CAESAR_REGISTRY_REF }}
        run: '[[ "$REGISTRY_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Set CAESAR_REGISTRY_REF to the reviewed CAESAR commit SHA"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: UFcompressor/CAESAR
          ref: ${{ vars.CAESAR_REGISTRY_REF }}
          path: caesar
          persist-credentials: false
      - name: Prepare trusted event
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/UFcompressor/UFL_MODELS/issues/$REQUESTED_ISSUE" > issue.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          issue = json.loads(Path('issue.json').read_text())
          Path('request-event.json').write_text(json.dumps(dict(
              action='opened', repository=dict(full_name='UFcompressor/UFL_MODELS'), issue=issue)))
          PY
          else
            cp "$GITHUB_EVENT_PATH" request-event.json
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          number = json.loads(Path('request-event.json').read_text())['issue']['number']
          assert type(number) is int and number > 0
          print(f'ISSUE_NUMBER={number}')
          PY
      - name: Validate and automatically commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git -C database config user.name 'github-actions[bot]'
          git -C database config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            # Only the disposable runner checkout is reset. Recompute IDs and
            # authorization against the latest catalog after concurrent pushes.
            git -C database fetch origin "$DEFAULT_BRANCH"
            git -C database reset --hard FETCH_HEAD
            python3 caesar/register_model.py process-event --database database --event request-event.json
            python3 caesar/register_model.py check --database database
            git -C database add -- model_catalog.json README.md
            if git -C database diff --cached --quiet; then exit 0; fi
            git -C database commit -m "Process model registry request #$ISSUE_NUMBER"
            if git -C database push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then exit 0; fi
          done
          echo 'Could not publish after concurrent updates; retry this issue from Actions.'
          exit 1
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo UFcompressor/UFL_MODELS --comment 'Registry request applied. The catalog and model list were committed automatically. Retirement preserves checkpoint identities.'
      - name: Report failure
        if: failure() && env.ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo UFcompressor/UFL_MODELS --body "Registry processing failed. See $RUN_URL for validation or publication errors. Correct invalid requests by opening a new request; administrators can retry infrastructure failures from Actions."
