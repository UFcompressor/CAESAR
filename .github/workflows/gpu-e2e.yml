name: Request external GPU tests

on:
  workflow_dispatch:
    inputs:
      backend:
        description: GPU backend to wait for on the selected branch/tag
        type: choice
        options: [nvidia, amd]
        default: nvidia
  # Status-only workflow: never check out or execute pull-request code here.
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  statuses: write

jobs:
  request-gpu-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'gpu-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark external GPU tests as waiting
        uses: actions/github-script@v7
        env:
          BACKEND: ${{ inputs.backend || 'nvidia' }}
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha || context.sha;
            const backend = process.env.BACKEND;
            if (!['nvidia', 'amd'].includes(backend)) throw new Error('Invalid backend');
            for (const mode of ['correctness', 'performance']) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha, state: 'pending',
                context: `gpu-tests/${backend}/${mode}`,
                description: 'Waiting for manually submitted Slurm GPU tests',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
            await core.summary.addHeading('Waiting for external GPU E2E tests')
              .addRaw(`Test commit: ${sha}\n\nSubmit the GPU correctness and performance Slurm jobs, then report each result with tests/gpu/report.py.\n`)
              .write();
