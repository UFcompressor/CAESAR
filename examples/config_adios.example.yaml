example_adios:
  data_path: /path/to/dataset.bp5
  # All float/double fields, sorted by name, at step 8 of a nine-step file.
  # section_range selects ADIOS steps (zero-based, end exclusive).
  # frame_range selects the first spatial axis of each 3D field.
  train_subset:
    variable_idx: null
    section_range: [8, 9]
    frame_range: [0, 1025]
  test_subset:
    variable_idx: null
    section_range: [8, 9]
    frame_range: [0, 1025]
train_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 15
  norm_type: mean_range
  train: true
  train_size: 256
test_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 0
  norm_type: mean_range
  test_size: [256, 256]
  train: false
