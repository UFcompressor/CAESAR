re3200:
  data_path: /lustre/blue2/ranka/eklasky/train_data/1025/1025.1025.1025.RE3200.bp5
  # Sorted fields: critq=0, pp=1, ux=2, uy=3, uz=4, vort=5.
  # Train on critq, pp, ux, uz, vort; hold out uy. Use step 8.
  # section_range selects ADIOS steps (zero-based, end exclusive).
  # frame_range selects the first spatial axis of each 3D field.
  train_subset:
    variable_idx: [0, 1, 2, 4, 5]
    section_range: [8, 9]
    frame_range: [0, 1025]
  test_subset:
    variable_idx: [3]
    section_range: [8, 9]
    frame_range: [0, 1025]
train_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 15
  norm_type: mean_range
  train: true
  train_size: 256
test_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 0
  norm_type: mean_range
  test_size: [256, 256]
  train: false
