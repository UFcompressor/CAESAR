xcompact3d:
  data_path: /lustre/blue2/ranka/eklasky/train_data/1025/1025.1025.1025.RE3200.bp5
  # All six float/double fields, sorted by name, at the last ADIOS step.
  # section_range selects ADIOS steps (zero-based, end exclusive).
  # frame_range selects the first spatial axis of each 3D field.
  train_subset:
    variable_idx: null
    section_range: [8, 9]
    frame_range: [0, 1025]
  test_subset:
    variable_idx: null
    section_range: [8, 9]
    frame_range: [0, 1025]
train_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 0
  norm_type: mean_range
  train: true
  train_size: 256
test_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 0
  norm_type: mean_range
  test_size: [256, 256]
  train: false
