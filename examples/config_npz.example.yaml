# NPZ files must contain a data array shaped [variable, section, frame, height, width].
# Ranges are zero-based with an exclusive end; variable_idx is a list of indices.
example_npz:
  data_path: /path/to/dataset.npz
  # First variable and section, using all 128 frames of this example array.
  train_subset:
    variable_idx: [0]
    section_range: [0, 1]
    frame_range: [0, 128]
  test_subset:
    variable_idx: [0]
    section_range: [0, 1]
    frame_range: [0, 128]

train_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 15
  norm_type: mean_range
  train: true
  train_size: 256

test_config:
  augment_type: {}
  inst_norm: true
  n_frame: 16
  n_overlap: 0
  norm_type: mean_range
  test_size: [256, 256]
  train: false
